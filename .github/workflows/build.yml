name: Build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app and run offline regression checks
        run: ./build.sh
      - name: Create clean source archive
        run: ./scripts/package-source.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Lyrical-Notch-local-build
          path: |
            dist/Lyrical-Notch-*-macos.zip
            dist/lyrical-notch-*-source.tar.gz
